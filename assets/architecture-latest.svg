<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">ALGET source-to-textbook architecture</title>
  <desc id="desc">A human-governed pipeline from instructor sources through extraction, shadow draft, and release gate into the learner reading runtime, with retrieval, agents, evidence, social learning, and secure storage.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfa"/>
      <stop offset="1" stop-color="#edf4f1"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d3e"/>
      <stop offset="1" stop-color="#176b61"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff5eb"/>
      <stop offset="1" stop-color="#c5ebdc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f3d3e" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#176b61"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#b57910"/>
    </marker>
    <style>
      .eyebrow { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
      .title { font: 750 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f3d3e; }
      .subtitle { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #52636a; }
      .label { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f3d3e; }
      .labelLight { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .body { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #52636a; }
      .bodyLight { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e7f5f0; }
      .small { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #637078; }
    </style>
  </defs>

  <rect width="1440" height="720" rx="24" fill="url(#canvas)"/>
  <rect x="1" y="1" width="1438" height="718" rx="23" fill="none" stroke="#d2e3dd"/>

  <text x="56" y="54" class="eyebrow" fill="#b57910">ALGET / RELEASE ARCHITECTURE · 2026</text>
  <text x="56" y="91" class="title">From source evidence to an accountable learning runtime</text>
  <text x="56" y="119" class="subtitle">Every generated page, interaction, and tutor response keeps a traceable path back to instructor-approved material.</text>

  <!-- Governed authoring pipeline -->
  <rect x="48" y="150" width="1344" height="198" rx="18" fill="#ffffff" stroke="#d2e3dd"/>
  <text x="72" y="180" class="eyebrow" fill="#176b61">01 · AUTHORING &amp; RELEASE</text>

  <g filter="url(#shadow)">
    <rect x="72" y="204" width="222" height="108" rx="14" fill="url(#source)"/>
    <text x="92" y="235" class="labelLight">Instructor sources</text>
    <text x="92" y="260" class="bodyLight">Google Docs · PDF · approved URL</text>
    <text x="92" y="285" class="bodyLight">syllabus, readings, rubrics</text>

    <rect x="328" y="204" width="222" height="108" rx="14" fill="#f5faf8" stroke="#a8d6c5"/>
    <text x="348" y="235" class="label">Extract &amp; quality</text>
    <text x="348" y="260" class="body">parse · normalize · checksum</text>
    <text x="348" y="285" class="body">page chunks · OCR flags</text>

    <rect x="584" y="204" width="222" height="108" rx="14" fill="#f5faf8" stroke="#a8d6c5"/>
    <text x="604" y="235" class="label">Shadow draft</text>
    <text x="604" y="260" class="body">reading · concepts · knowledge base</text>
    <text x="604" y="285" class="body">practice · tutor · social cues</text>

    <rect x="840" y="204" width="222" height="108" rx="14" fill="#fff9ec" stroke="#e8c87d"/>
    <text x="860" y="235" class="label">Human release gate</text>
    <text x="860" y="260" class="body">review → ready → publish</text>
    <text x="860" y="285" class="body">source coverage + audit trail</text>

    <rect x="1096" y="204" width="272" height="108" rx="14" fill="url(#runtime)" stroke="#7dc7ad"/>
    <text x="1116" y="235" class="label">Published module snapshot</text>
    <text x="1116" y="260" class="body">versioned pages + formative checks</text>
    <text x="1116" y="285" class="body">safe for learner delivery</text>
  </g>

  <path d="M 294 258 H 318" stroke="#176b61" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 550 258 H 574" stroke="#176b61" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 806 258 H 830" stroke="#b57910" stroke-width="3" marker-end="url(#arrowGold)"/>
  <path d="M 1062 258 H 1086" stroke="#176b61" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Runtime -->
  <rect x="48" y="374" width="1344" height="290" rx="18" fill="#ffffff" stroke="#d2e3dd"/>
  <text x="72" y="404" class="eyebrow" fill="#176b61">02 · LEARNER RUNTIME &amp; GOVERNANCE</text>

  <g filter="url(#shadow)">
    <rect x="72" y="430" width="254" height="176" rx="14" fill="url(#source)"/>
    <text x="94" y="463" class="labelLight">Cloudflare Pages</text>
    <text x="94" y="489" class="bodyLight">React reader + hybrid pagination</text>
    <text x="94" y="512" class="bodyLight">IntelRail · chat · assessment</text>
    <text x="94" y="535" class="bodyLight">accessible, responsive surfaces</text>
    <rect x="94" y="558" width="116" height="24" rx="12" fill="#2b8174"/>
    <text x="152" y="574" text-anchor="middle" class="small" fill="#ffffff">learner-facing</text>

    <rect x="362" y="430" width="254" height="176" rx="14" fill="#f5faf8" stroke="#a8d6c5"/>
    <text x="384" y="463" class="label">ALGET Worker</text>
    <text x="384" y="489" class="body">BigAL tutor · grading</text>
    <text x="384" y="512" class="body">agentic planning · safety</text>
    <text x="384" y="535" class="body">OpenRouter enrichment (optional)</text>
    <rect x="384" y="558" width="128" height="24" rx="12" fill="#c5ebdc"/>
    <text x="448" y="574" text-anchor="middle" class="small">edge execution</text>

    <rect x="652" y="430" width="254" height="176" rx="14" fill="#f5faf8" stroke="#a8d6c5"/>
    <text x="674" y="463" class="label">Grounding &amp; adaptation</text>
    <text x="674" y="489" class="body">section-scoped retrieval</text>
    <text x="674" y="512" class="body">Bayesian mastery + next step</text>
    <text x="674" y="535" class="body">evidence echo · peer pulse · cue</text>
    <rect x="674" y="558" width="150" height="24" rx="12" fill="#c5ebdc"/>
    <text x="749" y="574" text-anchor="middle" class="small">context-aware</text>

    <rect x="942" y="430" width="254" height="176" rx="14" fill="#f5faf8" stroke="#a8d6c5"/>
    <text x="964" y="463" class="label">Supabase</text>
    <text x="964" y="489" class="body">Auth · RLS · Realtime</text>
    <text x="964" y="512" class="body">mastery · roster · audit events</text>
    <text x="964" y="535" class="body">instructor/admin boundaries</text>
    <rect x="964" y="558" width="120" height="24" rx="12" fill="#c5ebdc"/>
    <text x="1024" y="574" text-anchor="middle" class="small">system of record</text>

    <rect x="1232" y="430" width="136" height="176" rx="14" fill="#fff9ec" stroke="#e8c87d"/>
    <text x="1252" y="463" class="label">Ops</text>
    <text x="1252" y="489" class="body">FastAPI parity</text>
    <text x="1252" y="512" class="body">KV queues</text>
    <text x="1252" y="535" class="body">observability</text>
    <rect x="1252" y="558" width="78" height="24" rx="12" fill="#f1d99e"/>
    <text x="1291" y="574" text-anchor="middle" class="small">governed</text>
  </g>

  <path d="M 220 312 V 420" stroke="#176b61" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1232 258 H 1280 V 420" stroke="#176b61" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 326 518 H 352" stroke="#176b61" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 616 518 H 642" stroke="#176b61" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 906 518 H 932" stroke="#176b61" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1196 518 H 1222" stroke="#b57910" stroke-width="3" marker-end="url(#arrowGold)"/>

  <text x="72" y="642" class="small">Traceability is a product feature: source checksum → page evidence → generated artifact → approval event → learner signal.</text>
  <text x="1368" y="642" text-anchor="end" class="small">ALGET · human-governed agentic LMS</text>
</svg>
