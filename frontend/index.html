<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UA Intelligent Textbook</title>
    <meta name="description" content="ALGET — Alabama Generative Intelligent Textbook. Know what to learn next, practice inside the reading, and understand why adaptive support appears." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main typography (Fraunces display serif + IBM Plex) as a non-blocking
         <link>: previously pulled via @import at the top of index.css, which
         chained CSS->CSS->font and delayed first render/LCP. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- UDL 3.0 (Representation): dyslexia-friendly + hyperlegible reading fonts.
         Atkinson Hyperlegible (high letter-disambiguation) loads from Google Fonts.
         OpenDyslexic is loaded via @font-face from a CDN with a CSS-only fallback
         stack (Comic Sans MS / system sans) so the dyslexic reading mode degrades
         gracefully if the network font is unavailable. Consumed by .font-dyslexic. -->
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'OpenDyslexic';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.woff2') format('woff2'),
             url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.woff') format('woff');
      }
      @font-face {
        font-family: 'OpenDyslexic';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-bold.woff2') format('woff2'),
             url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-bold.woff') format('woff');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pre-paint the landing hero before the React bundle boots: the SPA's
      // first paint (even its loading spinner) waited ~3s on script execution,
      // so LCP was the React-rendered H1. This static copy of the hero paints
      // as soon as CSS arrives and React replaces it with the identical
      // hydrated hero. Landing route only — deep links keep the empty root.
      if (location.pathname === '/') {
        document.getElementById('root').innerHTML =
          '<div class="editorial-shell" style="min-height:100vh">' +
          '<main><section class="ath-container ath-container-marketing grid gap-10 pb-16 pt-12 lg:grid-cols-[1.08fr_0.92fr] lg:gap-14 lg:pt-20" style="margin-top:72px">' +
          '<div class="flex flex-col justify-center">' +
          '<p class="mt-8 editorial-kicker">University learning platform</p>' +
          '<h1 class="editorial-title ath-hero-title mt-3 max-w-4xl">Alabama Generative Intelligent Textbook</h1>' +
          '<p class="ath-hero-dek mt-6 max-w-2xl">Know what to learn next, practice without leaving the reading, and understand why adaptive support appears.</p>' +
          '</div></section></main></div>';
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
