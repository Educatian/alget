name: CI

# Blocking quality gate for ALGET. Every job here must pass before a change
# can merge. The gate guards three things: authored content (schema + lint),
# the frontend (tests, lint, build), and the backend (the four pinned test
# modules). See CONTRIBUTING.md and ARCHITECTURE.md section 4.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content validation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install jsonschema (validator engine)
        run: python -m pip install --upgrade pip jsonschema
      - name: Validate content against JSON Schemas
        run: python scripts/validate_content.py
      - name: Lint for generated boilerplate
        run: python scripts/lint_boilerplate.py
      - name: Lint for content duplication
        run: python scripts/lint_duplication.py

  frontend:
    name: Frontend tests, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Lint (eslint)
        run: npx eslint src
      - name: Build (vite)
        run: npx vite build
      - name: Release readiness safeguards
        working-directory: .
        run: node scripts/release_readiness.mjs

  e2e:
    name: Browser smoke and learner workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        working-directory: frontend
        run: npm run test:e2e

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install test runner
        # pytest is not pinned in backend/requirements.txt (it is a dev-only
        # dependency), so install it explicitly for the test job.
        run: pip install pytest
      - name: Run pinned backend test modules
        run: >-
          python -m pytest
          backend/test_eval.py
          backend/test_misconceptions.py
          backend/test_support_policy.py
          backend/test_agent_persona.py
          backend/test_access_validation.py

  static-snapshot:
    name: Static snapshot integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Verify committed Cloudflare Pages API snapshot
        run: node scripts/verify_static_snapshot.mjs

  workers:
    name: Cloudflare worker parity and dry runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install adaptive worker dependencies
        working-directory: cloudflare/adaptive-recommendation
        run: npm ci
      - name: Adaptive policy parity
        working-directory: cloudflare/adaptive-recommendation
        run: npm run parity
      - name: Adaptive worker dry run
        working-directory: cloudflare/adaptive-recommendation
        run: npm run dry-run
      - name: Install LLM worker dependencies
        working-directory: cloudflare/llm-proxy
        run: npm ci
      - name: LLM worker dry run
        working-directory: cloudflare/llm-proxy
        run: npm run dry-run
