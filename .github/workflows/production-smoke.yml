name: Production smoke

# This is intentionally independent from the build workflow. It checks the
# deployed artifact, not the checkout, so a Pages Function or Worker route can
# fail loudly even when source-level CI remains green.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Live production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
      - name: Check deployed Pages and Worker surfaces
        run: node scripts/post_deploy_smoke.mjs
