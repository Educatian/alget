# Cloudflare Worker: alget-llm
#
# Dynamic AI layer for ALGET (BigAL rail, chat, grading, generation). The static
# Pages /api only serves content snapshots, so all LLM endpoints route here.
#
# SECRET (NOT stored here): set once via
#   wrangler secret put OPENROUTER_API_KEY
# Optional non-secret config:
#   OPENROUTER_MODEL  (default google/gemini-2.0-flash-001)
#   BACKEND_API_BASE  (default the onrender FastAPI deploy)

name = "alget-llm"
main = "src/index.js"
compatibility_date = "2025-05-01"

[vars]
OPENROUTER_MODEL = "google/gemini-2.0-flash-001"
OPENROUTER_IMAGE_MODEL = "google/gemini-2.5-flash-image"
