# Cloudflare Worker: alget-llm
#
# Dynamic AI/compute layer for ALGET (BigAL rail, chat, grading, research
# validators). The static Pages /api only serves content snapshots, so dynamic
# POST endpoints route here.
#
# SECRET (NOT stored here): set once via
#   wrangler secret put OPENROUTER_API_KEY
# Optional non-secret config:
#   OPENROUTER_MODEL  (default google/gemini-2.0-flash-001)
#   BACKEND_API_BASE  (unset; optional local/legacy proxy escape hatch)

name = "alget-llm"
main = "src/index.js"
compatibility_date = "2025-05-01"

[vars]
OPENROUTER_MODEL = "google/gemini-2.5-flash"

# Internal binding to the adaptive-policy Worker (reliable worker-to-worker;
# avoids the same-account public *.workers.dev subrequest restriction).
[[services]]
binding = "ADAPTIVE"
service = "alget-adaptive-recommendation"
